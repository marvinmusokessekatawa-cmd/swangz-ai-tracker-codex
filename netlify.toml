# Swangz Avenue — AI Adoption Tracker (Netlify config)
# Single-file static deploy. Drag-and-drop the folder to https://app.netlify.com/drop
# or connect this repo and Netlify will pick this config up automatically.

[build]
  publish = "."
  command = ""

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options       = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy       = "strict-origin-when-cross-origin"
    # The app uses crypto.subtle (admin password hashing); served over HTTPS this works.
